services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmylaser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: hmylaser
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmylaser -d hmylaser"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hmylaser:${DB_PASSWORD:-changeme}@db:5432/hmylaser
      SESSION_SECRET: ${SESSION_SECRET}
      BRIDGE_ACCESS_SECRET: ${BRIDGE_ACCESS_SECRET:-changeme}
      NEXT_PUBLIC_GITHUB_URL: https://github.com/Haaremy/hmyLaser32
      NEXT_PUBLIC_DEFAULT_LOCALE: de
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && node server.mjs"

volumes:
  db_data:
